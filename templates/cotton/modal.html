<c-vars id title />
<dialog id="{{ id }}" class="modal glass" aria-labelledby="{{ id }}-title" closedby="any">
  <c-modal-close :for="id" />
  <h2 id="{{ id }}-title" class="section-title">{{ title }}</h2>
  <div class="mt-3 text-ink-2">{{ slot }}</div>
  {% if actions %}<form hx-boost="false" method="dialog" class="mt-7 flex flex-wrap justify-end gap-2">{{ actions }}</form>{% endif %}
</dialog>
