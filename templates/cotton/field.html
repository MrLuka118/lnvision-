{% load forms %}
<c-vars field class="" />
<div class="field{% if class %} {{ class }}{% endif %}">
  {% if field.widget_type == "checkbox" %}
    <label class="check">{% widget field %}<span>{{ field.label }}</span></label>
  {% else %}
    <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-ink-2">{% translate "optional" %}</span>{% endif %}</label>
    {% widget field %}
  {% endif %}
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <div id="{{ field.auto_id }}_error">
      {% for error in field.errors %}<p class="field-error"><c-icon name="triangle-alert" size="sm" class="mt-0.5" />{{ error }}</p>{% endfor %}
    </div>
  {% endif %}
</div>
