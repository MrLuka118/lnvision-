<c-vars name size="" class="" label="" />
<svg class="icon{% if size %} icon-{{ size }}{% endif %}{% if class %} {{ class }}{% endif %}"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %} focusable="false"><use href="{% static 'icons/sprite.svg' %}#{{ name }}"></use></svg>
