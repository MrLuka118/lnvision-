{# A processed photo: AVIF with JPEG fallback, sized by srcset, blurred placeholder behind it. #}
<c-vars photo sizes="(min-width: 64rem) 25vw, 50vw" loading="lazy" alt="" class="" />
<picture class="photo{% if class %} {{ class }}{% endif %}" style="--ar: {{ photo.aspect_ratio|stringformat:'.4f' }}; background-color: {{ photo.dominant_color|default:'var(--surface)' }};{% if photo.lqip %} background-image: url({{ photo.lqip }});{% endif %}">
  {% if photo.srcset_avif %}<source type="image/avif" srcset="{{ photo.srcset_avif }}" sizes="{{ sizes }}">{% endif %}
  <img src="{{ photo.src }}" srcset="{{ photo.srcset_jpg }}" sizes="{{ sizes }}" width="{{ photo.width }}" height="{{ photo.height }}" loading="{{ loading }}" decoding="async" alt="{{ alt }}" {{ attrs }}>
</picture>
