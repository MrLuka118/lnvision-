# Local development stack. Production runs the same image with config.settings.prod.
name: aperture

x-app: &app
  build: .
  image: aperture-studio:dev
  env_file: .env
  environment:
    DATA_DIR: /data
  volumes:
    - .:/app
    - data:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  # Restarts on code changes in development (Celery has no reloader of its own).
  worker:
    <<: *app
    command: >-
      watchfiles --filter python
      "celery -A config worker -Q default,images,zips -l info --concurrency 4" apps config
    environment:
      DATA_DIR: /data
      WATCHFILES_FORCE_POLLING: "true"

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /data/celerybeat-schedule

  # Polls instead of relying on file events, which do not cross the VM boundary on macOS.
  tailwind:
    <<: *app
    command: >-
      sh -c 'exec /opt/tailwind/tailwindcss-linux-*
      -i assets/css/app.css -o static/css/app.css --watch=always --poll=400'
    depends_on: []

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aperture
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture -d aperture"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  pgdata:
  data:
